issueTrackerURL="https://github.com/Dunkmania101/SpatialHarvesters/issues"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
displayURL="https://www.curseforge.com/minecraft/mc-mods/spatial-harvesters-forge"
logoFile="spatialharvesters-logo.png"
credits="Sirdurpsalot - The Texture Overhaul of 0.10.0"
authors="Dunkmania101"
description='''
Adds harvesters that gather resources from space-time itself!
Inspired by EnvironmentalTech.
'''

# Two of the three Forge-era mixins are gone: EntityMixin was replaced by Entity#captureDrops and
# WorldMixin by LevelTickEvent.Post. Only the drop-pipeline @Invoker remains.
# No refmap is needed - NeoForge runs on official mappings.
[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]] #mandatory
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
